<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>机器人世界</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #7dd3fc;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.95;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .robot {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 机器人世界</h1>
    <p>探索人工智能与机器人技术的未来</p>
  </header>

  <main>
    <div class="card">
      <span class="robot">🦾</span>
      <h2>什么是机器人</h2>
      <p>
        机器人是一种能够感知环境、进行决策并执行动作的自动化机器，
        广泛应用于工业、医疗、服务和科研领域。
      </p>
    </div>

    <div class="card">
      <span class="robot">🧠</span>
      <h2>人工智能</h2>
      <p>
        人工智能为机器人赋予“思考”的能力，包括视觉识别、语音理解、
        自主规划与学习，使机器人更加智能。
      </p>
    </div>

    <div class="card">
      <span class="robot">🏭</span>
      <h2>应用场景</h2>
      <p>
        从自动化工厂、无人仓储，到手术机器人、家庭助理，
        机器人正在改变我们的生活和工作方式。
      </p>
    </div>

    <div class="card">
      <span class="robot">🚀</span>
      <h2>未来发展</h2>
      <p>
        未来的机器人将更加安全、灵活且具备情感交互能力，
        与人类协作，共同创造更高效、更美好的社会。
      </p>
    </div>
  </main>

  <footer>
    © 2026 机器人前景
  </footer>
</body>
</html>
